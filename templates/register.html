<!DOCTYPE html>
<html>
<head>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
<div class="card p-4 w-50 mx-auto shadow">

<h2 class="text-center mb-3">Register</h2>

<form method="POST">
<input name="name" class="form-control mb-2" placeholder="Full Name">
<input name="username" class="form-control mb-2" placeholder="Username">
<input name="password" type="password" class="form-control mb-3" placeholder="Password">

<button class="btn btn-success w-100">Register</button>
</form>

<hr>

<p class="text-center">
Already have account?
<a href="/login">Login here</a>
</p>

</div>
</div>

</body>
</html>
