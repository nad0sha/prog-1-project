{% extends "base.html" %}
{% block content %}

<h2 class="text-center mb-4">💳 Payment</h2>

<div class="card p-4 mx-auto" style="max-width:400px;">

<form method="POST" action="/pay">

<input class="form-control mb-3" placeholder="Card Number" required>
<input class="form-control mb-3" placeholder="Name on Card" required>
<input class="form-control mb-3" placeholder="MM/YY" required>
<input class="form-control mb-3" placeholder="CVV" required>

<button class="btn btn-success w-100">Pay Now</button>

</form>

</div>

{% endblock %}
