{% extends "base.html" %}
{% block content %}

<h1 class="mb-4">🛒 Your Cart</h1>

{% for item in items %}
<div class="card p-3 mb-2 d-flex flex-row justify-content-between align-items-center">

<div>
<strong>{{ item[1] }}</strong>
<p>{{ item[2] }} EGP</p>
</div>

<a href="/remove/{{ item[0] }}" class="btn btn-danger">Remove</a>

</div>
{% endfor %}

<h3 class="mt-3">Total: {{ total }} EGP</h3>

<a href="/payment" class="btn btn-primary w-100">Go to Payment</a>

{% endblock %}
